name: Build BIKE WRAP SONU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -q BIKE_WRAP_SONU_Android_Project.zip -d workdir

      - name: Build APK
        run: |
          cd workdir/BIKE_WRAP_SONU
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIKE-WRAP-SONU-APK
          path: workdir/BIKE_WRAP_SONU/app/build/outputs/apk/debug/app-debug.apk
